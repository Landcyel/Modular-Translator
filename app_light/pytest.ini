[pytest]
# Add the project root to sys.path so tests under tests/ can `import core` / `import app`
# (tests/ has no __init__.py: pytest's prepend mode would put the tests/ package root
# first on sys.path, shadowing `import core` with tests/core/; keeping it non-package
# with pythonpath=. is the most robust)
pythonpath = .

# Disable pytest's built-in tmpdir plugin: on Windows/Python 3.14 its basetemp dir is
# created with mode=0o700, whose ACL is not enumerable in a restricted sandbox
# (PermissionError). tests/conftest.py provides an equivalent tmp_path fixture
# (project-local temp, no mode argument).
addopts = -p no:tmpdir

# Collect only real pytest case directories; tests/scripts/ holds end-to-end /
# verification scripts (test_facade.py etc. run directly via `python
# tests/scripts/xxx.py`) and must not be collected, avoiding PytestCollectionWarning.
testpaths = tests/core tests/app
