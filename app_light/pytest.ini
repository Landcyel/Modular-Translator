[pytest]
# 项目根加入 sys.path，保证 tests/ 下用例可 `import core` / `import app`
# （tests/ 不设 __init__.py：pytest prepend 模式会把 tests/ 包根插到 sys.path
# 最前，导致 `import core` 被 tests/core/ 遮蔽；保持非包 + pythonpath=. 最稳）
pythonpath = .

# 禁用 pytest 内建 tmpdir 插件：Windows/Python 3.14 下其 basetemp 目录以
# mode=0o700 创建，受限沙箱中 ACL 不可枚举（PermissionError）。
# tests/conftest.py 提供等价的 tmp_path fixture（项目本地 temp，无 mode 参数）。
addopts = -p no:tmpdir

# 只收集真正的 pytest 用例目录；tests/scripts/ 下为端到端/验证脚本
# （test_facade.py 等按 `python tests/scripts/xxx.py` 直接运行），不参与收集，
# 避免 PytestCollectionWarning。
testpaths = tests/core tests/app
